// 上传数据 → 分析
function handleFileUpload(inp) {
  var file = inp.files && inp.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var content = String((e.target && e.target.result) || '');
    var sample = content.slice(0, 6000);
    addUserMessage('📎 已上传数据文件：' + file.name);
    if (!LLM_ENDPOINT) {
      addAIMessage('<div style="font-size:14px;">当前是演示模式（未接大模型），无法分析上传数据。接入大模型后即可自动分析。</div>');
      inp.value = ''; return;
    }
    var mid = 'llm_' + Date.now();
    addAIMessage('<div style="font-size:14px;color:var(--text-muted);">🤔 正在分析你上传的数据…</div>', mid);
    analyzeData(file.name, sample).then(function(ans){
      var el = document.getElementById(mid);
      if (el) el.querySelector('.msg-bubble').innerHTML = '<div style="font-size:14px;line-height:1.75;white-space:pre-wrap;">' + mdLite(ans) + '</div>';
      scrollToBottom();
    }).catch(function(err){
      var el = document.getElementById(mid);
      if (el) el.querySelector('.msg-bubble').innerHTML = '<div style="font-size:14px;color:#C00;">分析失败：' + escapeHtml(err.message) + '</div>';
    });
    inp.value = '';
  };
  reader.readAsText(file);
}

async function analyzeData(name, content) {
  var roleName = (currentRole && currentRole.name) ? currentRole.name : '快消销售';
  var sys = '你是 eBest 快消行业数据分析助手，当前使用者角色：' + roleName + '。用户上传了一份数据文件，请用中文输出：1) 一句话概括数据内容；2) 3-5 条关键洞察；3) 可执行建议。专业、简洁。' + llmLangClause();
  var prompt = '文件名：' + name + '\n数据内容（可能为节选）：\n' + content;
  var resp = await fetch(LLM_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system: sys, messages: [{ role: 'user', content: prompt }] })
  });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  var data = await resp.json();
  return data.text || '（无返回）';
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  addUserMessage(text);
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  // Check if message contains @ mention
  const mentionMatch = text.match(/@(\w+)/);
  if (mentionMatch) {
    const id = mentionMatch[1].toUpperCase();
    const agent = agents.find(a => a.id === id);
    const skill = skills.find(s => s.id === id);
    if (agent) {
      setTimeout(() => openParamPanel(agent, 'agent'), 500);
      return;
    } else if (skill) {
      setTimeout(() => openParamPanel(skill, 'skill'), 500);
      return;
    }
  }

  // Free-text chat
  if (LLM_ENDPOINT) {
    var mid = 'llm_' + Date.now();
    addAIMessage('<div style="font-size:14px;color:var(--text-muted);">'+t('thinking')+'</div>', mid);
    chatWithRouting(text).then(function(res){
      var el = document.getElementById(mid);
      if (el) el.querySelector('.msg-bubble').innerHTML = renderAnswerWithChips(res.text, res.ids);
      scrollToBottom();
    }).catch(function(e){
      var el = document.getElementById(mid);
      if (el) el.querySelector('.msg-bubble').innerHTML = '<div style="font-size:14px;color:#C00;">连接大模型失败：' + escapeHtml(e.message) + '<br>请检查 Worker 网址是否填对、是否已部署成功。</div>';
    });
    return;
  }
  setTimeout(() => {
    addAIMessage('<div style="font-size:14px;">收到您的消息。可使用 <strong>@AgentID</strong> 或 <strong>@SkillID</strong> 调用具体功能（如 <strong>@A1</strong> 潜力门店、<strong>@S1</strong> 拜访任务包）；接入大模型后也可直接用中文提问。</div>');
  }, 600);
}

function toggleMention() {
  const popup = document.getElementById('mentionPopup');
  popup.classList.toggle('show');
  if (popup.classList.contains('show')) {
    renderMentionList();
    setTimeout(() => { var el = document.getElementById('mentionSearch'); el && el.focus(); }, 100);
  }
}

function setMentionTab(tab, el) {
  mentionTab = tab;
  document.querySelectorAll('.mention-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderMentionList();
}

function renderMentionList() {
  const container = document.getElementById('mentionList');
  const search = ((document.getElementById('mentionSearch')&&document.getElementById('mentionSearch').value) || '').toLowerCase();
  const arr = mentionTab === 'agents' ? agents : skills;
  let filtered = arr.filter(item => {
    if (!roleMatch(item)) return false;
    if (search && !item.name.includes(search) && !item.id.toLowerCase().includes(search)) return false;
    return true;
  });
  container.innerHTML = filtered.map(item => {
    return '<div class="mention-item" data-mention-id="' + item.id + '" data-mention-type="' + (mentionTab === 'agents' ? 'agent' : 'skill') + '">'+
      '<span class="mention-item-id">' + item.id + '</span>'+
      '<div class="mention-item-info"><div class="mention-item-name">' + aName(item) + '</div><div class="mention-item-desc">' + aDesc(item) + '</div></div>'+
    '</div>';
  }).join('');
  if (!filtered.length) container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px;">无匹配结果</div>';
}

function filterMention() { renderMentionList(); }

function selectMention(id, type) {
  const arr = type === 'agent' ? agents : skills;
  const item = arr.find(x => x.id === id);
  if (item) {
    document.getElementById('mentionPopup').classList.remove('show');
    openParamPanel(item, type);
  }
}

// ==================== REMAINING FUNCTIONS ====================

function newChat() {
  document.getElementById('messagesContainer').innerHTML = '';
  document.getElementById('welcomeMsg').style.display = 'block';
  updateWelcome();
  closeSidebar();
}


function showMentionPopup() {
  var popup = document.getElementById('mentionPopup');
  var input = document.getElementById('chatInput');
  var rect = input.getBoundingClientRect();
  popup.style.bottom = (window.innerHeight - rect.top + 10) + 'px';
  popup.style.left = rect.left + 'px';
  renderMentionList();
  popup.classList.add('show');
}
